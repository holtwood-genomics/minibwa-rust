name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: minibwa-rust

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Parse version
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          grep -q "^version = \"$VERSION\"" Cargo.toml

      - name: Install C build dependencies
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev gcc make

      - name: Build C minibwa reference
        run: |
          COMMIT=$(grep -v '^#' C_MINIBWA_COMMIT | tr -d '[:space:]')
          git clone https://github.com/lh3/minibwa.git "${GITHUB_WORKSPACE}/../minibwa"
          git -C "${GITHUB_WORKSPACE}/../minibwa" checkout "$COMMIT"
          make -C "${GITHUB_WORKSPACE}/../minibwa" -j"$(nproc)"
          test -x "${GITHUB_WORKSPACE}/../minibwa/minibwa"

      - name: Run release verification
        env:
          MINIBWA_REQUIRE_PARITY: "1"
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: minibwa-rust-linux-amd64-static
            ext: ''
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: minibwa-rust-linux-amd64
            ext: ''
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: minibwa-rust-windows-amd64
            ext: '.exe'
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: minibwa-rust-macos-amd64
            ext: ''
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: minibwa-rust-macos-arm64
            ext: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}${{ matrix.ext }} ${{ matrix.artifact }}${{ matrix.ext }}
          chmod +x ${{ matrix.artifact }}${{ matrix.ext }}
          tar czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}${{ matrix.ext }}

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}${{ matrix.ext }}" "${{ matrix.artifact }}${{ matrix.ext }}"
          Compress-Archive -Path "${{ matrix.artifact }}${{ matrix.ext }}" -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: ignore

  publish:
    name: Publish GitHub release
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts

      - name: Prepare assets
        run: |
          mkdir -p release-assets
          find artifacts -name '*.tar.gz' -exec cp {} release-assets/ \;
          find artifacts -name '*.zip' -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          generate_release_notes: true
          files: release-assets/*
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
